version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: fitfuel-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fitfuel
      MYSQL_USER: fitfuel
      MYSQL_PASSWORD: fitfuel123
      MYSQL_ROOT_HOST: '%'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - fitfuel-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Spring Boot Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fitfuel-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/fitfuel?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: fitfuel
      SPRING_DATASOURCE_PASSWORD: fitfuel123
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_SHOW_SQL: 'false'
      APP_JWT_SECRET: MySecretKeyForJWT123456789MySecretKeyForJWT123456789ChangeThisInProduction
      APP_JWT_EXPIRATION_IN_MS: '86400000'
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - fitfuel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Nginx Frontend Server
  nginx:
    image: nginx:latest
    container_name: fitfuel-frontend
    ports:
      - "5500:80"
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - fitfuel-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

networks:
  fitfuel-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
